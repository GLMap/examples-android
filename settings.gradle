pluginManagement {
    repositories {
        mavenLocal()
        maven { url 'https://maven.globus.software/artifactory/libs' }
        maven { url 'https://maven.globus.software/artifactory/snapshots' }
        google()
        mavenCentral()
    }
}
def useLocalGLMap = providers.gradleProperty('useLocalGLMap')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://maven.globus.software/artifactory/libs' }
        maven { url 'https://maven.globus.software/artifactory/snapshots' }
    }
    // Only source builds need the parent SDK's catalog. Published demos also build standalone.
    if (useLocalGLMap) {
        versionCatalogs {
            libs {
                from(files('../Framework/gradle/libs.versions.toml'))
            }
        }
    }
}

if (useLocalGLMap) {
    include ':glmapcore'
    project(':glmapcore').projectDir = file('../Framework/glmapcore')

    include ':glmap'
    project(':glmap').projectDir = file('../Framework/glmap')

    include ':glsearch'
    project(':glsearch').projectDir = file('../Framework/glsearch')

    include ':glroute'
    project(':glroute').projectDir = file('../Framework/glroute')

    include ':res-defaultstyle'
    project(':res-defaultstyle').projectDir = file('../Framework/res-defaultstyle')
}

include ':kotlinDemo'
